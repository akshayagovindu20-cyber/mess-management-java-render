server.port=${PORT:8080}

# Spring Application Name
spring.application.name=CampusMess

# Embedded Database (Runs out of the box with zero external configuration)
spring.datasource.url=jdbc:h2:file:./data/mess_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
