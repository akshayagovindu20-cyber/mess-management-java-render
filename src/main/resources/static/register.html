<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Campus Mess Management</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2.5rem 1rem;">

  <div style="width: 100%; max-width: 520px;">
    <!-- Logo -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" style="display: inline-flex; align-items: center; gap: 0.75rem; text-decoration: none;">
        <div class="brand-icon" style="width: 2.75rem; height: 2.75rem; font-size: 1.4rem;">🍽️</div>
        <span style="font-size: 1.6rem; font-weight: 800; color: #ffffff;">Campus<span style="color: #38bdf8;">Mess</span></span>
      </a>
      <p style="color: #94a3b8; font-size: 0.925rem; margin-top: 0.4rem;">Join the dining platform. Fill your details below.</p>
    </div>

    <!-- Registration Card -->
    <div class="card" style="box-shadow: var(--shadow-lg); border-color: #334155; padding: 2.25rem;">
      <!-- Alert Banner -->
      <div id="register-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: 1.25rem;"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name <span style="color: var(--danger);">*</span></label>
          <input type="text" id="name" class="form-control" placeholder="Alex Johnson" required>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="form-group">
            <label for="email">Institutional Email <span style="color: var(--danger);">*</span></label>
            <input type="email" id="email" class="form-control" placeholder="alex@mess.com" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number <span style="color: var(--danger);">*</span></label>
            <input type="tel" id="phone" class="form-control" placeholder="+91 9876543210" required>
          </div>
        </div>

        <div class="form-group">
          <label for="role">Register As <span style="color: var(--danger);">*</span></label>
          <select id="role" class="form-control" required onchange="handleRoleChange(this.value)">
            <option value="STUDENT">Student (Hostel Resident)</option>
            <option value="MANAGER">Mess Manager</option>
            <option value="COOK">Cook / Kitchen Staff</option>
          </select>
          <small style="color: #64748b; font-size: 0.775rem; margin-top: 0.25rem;">
            🛡️ Administrator accounts cannot be registered publicly and must be provisioned by super-admins.
          </small>
        </div>

        <!-- Student-specific fields -->
        <div id="student-extra-fields">
          <div class="form-group">
            <label for="studentId">Student ID / Roll No</label>
            <input type="text" id="studentId" class="form-control" placeholder="STU-2026-081">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="form-group">
              <label for="hostelBlock">Hostel Block</label>
              <input type="text" id="hostelBlock" class="form-control" placeholder="Block A">
            </div>
            <div class="form-group">
              <label for="roomNumber">Room Number</label>
              <input type="text" id="roomNumber" class="form-control" placeholder="204-B">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="form-group">
            <label for="password">Password <span style="color: var(--danger);">*</span></label>
            <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" required minlength="8">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password <span style="color: var(--danger);">*</span></label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required minlength="8">
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary register-submit" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
          <span id="btn-text">Create Account</span>
          <span id="btn-spinner" style="display: none;">Registering...</span>
        </button>
      </form>
    </div>

    <!-- Login Link -->
    <div style="text-align: center; margin-top: 1.5rem;">
      <p style="color: #94a3b8; font-size: 0.9rem;">
        Already registered? <a href="login.html" style="color: #38bdf8; font-weight: 600;">Sign in here</a>
      </p>
      <p style="margin-top: 0.5rem;">
        <a href="index.html" style="color: #64748b; font-size: 0.85rem;">&larr; Back to Home</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function handleRoleChange(role) {
      const extra = document.getElementById('student-extra-fields');
      if (role === 'STUDENT') {
        extra.style.display = 'block';
      } else {
        extra.style.display = 'none';
      }
    }

    const form = document.getElementById('register-form');
    const alertBox = document.getElementById('register-alert');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const role = document.getElementById('role').value;
      const studentId = document.getElementById('studentId') ? document.getElementById('studentId').value.trim() : '';
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Client-side validations
      if (!name) {
        showAlert('Full name is required.', 'error');
        return;
      }
      if (!email.match(/^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/)) {
        showAlert('Please enter a valid email address.', 'error');
        return;
      }
      if (phone.length < 7) {
        showAlert('Please enter a valid phone number (at least 7 digits).', 'error');
        return;
      }
      if (password.length < 8) {
        showAlert('Password must be at least 8 characters long.', 'error');
        return;
      }
      if (password !== confirmPassword) {
        showAlert('Password confirmation does not match.', 'error');
        return;
      }

      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline';
      submitBtn.disabled = true;

      try {
        const payload = {
          name,
          email,
          phone,
          role,
          studentId,
          password,
          confirmPassword
        };

        const res = await apiCall('/auth/register', 'POST', payload);
        if (res.success) {
          showAlert(res.message || 'Registration successful. Please login.', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          showAlert(res.message || 'Registration failed.', 'error');
        }
      } catch (err) {
        showAlert(err.message || 'Registration failed.', 'error');
      } finally {
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
        submitBtn.disabled = false;
      }
    });

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
      if (type === 'error') {
        alertBox.style.backgroundColor = 'var(--danger-light)';
        alertBox.style.color = '#991b1b';
        alertBox.style.border = '1px solid #fecaca';
      } else {
        alertBox.style.backgroundColor = 'var(--accent-light)';
        alertBox.style.color = '#065f46';
        alertBox.style.border = '1px solid #a7f3d0';
      }
    }
  </script>
</body>
</html>
