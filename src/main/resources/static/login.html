<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Campus Mess Management</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem 1rem;">

  <div style="width: 100%; max-width: 440px;">
    <!-- Logo -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" style="display: inline-flex; align-items: center; gap: 0.75rem; text-decoration: none;">
        <div class="brand-icon" style="width: 2.75rem; height: 2.75rem; font-size: 1.4rem;">🍽️</div>
        <span style="font-size: 1.6rem; font-weight: 800; color: #ffffff;">Campus<span style="color: #38bdf8;">Mess</span></span>
      </a>
      <p style="color: #94a3b8; font-size: 0.925rem; margin-top: 0.4rem;">Welcome back! Please sign in to your dashboard.</p>
    </div>

    <!-- Login Card -->
    <div class="card" style="box-shadow: var(--shadow-lg); border-color: #334155; padding: 2.25rem;">
      <!-- Error / Alert Banner -->
      <div id="login-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: 1.25rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Institutional Email</label>
          <input type="email" id="email" class="form-control" placeholder="name@mess.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="password">Password</label>
            <a href="javascript:void(0)" onclick="openModal('forgot-modal')" style="font-size: 0.8rem; font-weight: 600; color: var(--primary);">Forgot password?</a>
          </div>
          <div style="position: relative;">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required style="padding-right: 2.75rem;">
            <button type="button" id="toggle-password" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #64748b; font-size: 0.9rem;" title="Show/Hide Password">👁️</button>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.85rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: #475569; font-weight: 500;">
            <input type="checkbox" id="remember-me" checked> Remember me
          </label>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
          <span id="btn-text">Sign In</span>
          <span id="btn-spinner" style="display: none;">Authenticating...</span>
        </button>
      </form>

      <!-- 1-Click Demo Accounts -->
      <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px dashed var(--border-color);">
        <p style="font-size: 0.775rem; font-weight: 700; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; text-align: center; margin-bottom: 0.75rem;">
          ⚡ Quick 1-Click Demo Login:
        </p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('student@mess.com', 'Student@123', 'student.html')">
            👨‍🎓 Student
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('manager@mess.com', 'Manager@123', 'manager.html')">
            📋 Manager
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('cook@mess.com', 'Cook@123', 'cook.html')">
            👨‍🍳 Cook
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('admin@mess.com', 'Admin@123', 'admin.html')">
            🛡️ Admin
          </button>
        </div>
      </div>
    </div>

    <!-- Register Link -->
    <div style="text-align: center; margin-top: 1.5rem;">
      <p style="color: #94a3b8; font-size: 0.9rem;">
        Don't have an account yet? <a href="register.html" style="color: #38bdf8; font-weight: 600;">Register here</a>
      </p>
      <p style="margin-top: 0.5rem;">
        <a href="index.html" style="color: #64748b; font-size: 0.85rem;">&larr; Back to Home</a>
      </p>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="font-size: 1.15rem;">Reset Your Password</h3>
        <button class="btn btn-secondary btn-sm" onclick="closeModal('forgot-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom: 1rem; font-size: 0.9rem;">
          Enter your institutional email. A password reset token and instructional link will be simulated.
        </p>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="reset-email" class="form-control" placeholder="alex@mess.com">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('forgot-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="simulateReset()">Send Reset Link</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Password toggle
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
      pwdInput.setAttribute('type', type);
      toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
    });

    // Fill demo credentials and submit immediately
    function fillDemo(email, pass, target) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
      document.getElementById('login-form').dispatchEvent(new Event('submit'));
    }

    // Submit handler
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert('Please provide both email and password.', 'error');
        return;
      }

      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline';
      submitBtn.disabled = true;

      try {
        const res = await apiCall('/auth/login', 'POST', { email, password });
        if (res.success && res.user) {
          setCurrentUser(res.user);
          showAlert('Login successful! Redirecting...', 'success');

          const roleRoutes = {
            student: 'student.html',
            manager: 'manager.html',
            cook: 'cook.html',
            admin: 'admin.html'
          };
          const target = roleRoutes[res.user.role.toLowerCase()] || 'student.html';
          setTimeout(() => {
            window.location.href = target;
          }, 400);
        } else {
          showAlert(res.message || 'Login failed.', 'error');
        }
      } catch (err) {
        showAlert(err.message || 'Invalid email or password.', 'error');
      } finally {
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
        submitBtn.disabled = false;
      }
    });

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
      if (type === 'error') {
        alertBox.style.backgroundColor = 'var(--danger-light)';
        alertBox.style.color = '#991b1b';
        alertBox.style.border = '1px solid #fecaca';
      } else {
        alertBox.style.backgroundColor = 'var(--accent-light)';
        alertBox.style.color = '#065f46';
        alertBox.style.border = '1px solid #a7f3d0';
      }
    }

    function simulateReset() {
      const email = document.getElementById('reset-email').value;
      if (!email) {
        showToast('Please enter an email address.', 'error');
        return;
      }
      closeModal('forgot-modal');
      showToast('Password reset link has been dispatched to ' + email, 'success');
    }
  </script>
</body>
</html>
