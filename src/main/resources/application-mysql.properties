# MySQL Configuration Profile
# Activate via: java -jar app.jar --spring.profiles.active=mysql

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mess_management_db?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Managed databases provision the database separately; Hibernate creates/updates tables.
spring.sql.init.mode=never
spring.h2.console.enabled=false
app.demo-data.enabled=false
