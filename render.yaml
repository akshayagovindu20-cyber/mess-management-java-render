services:
  - type: web
    name: campusmess
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: campusmess-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: campusmess-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: campusmess-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: campusmess-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: campusmess-db
          property: password

databases:
  - name: campusmess-db
    databaseName: campusmess
    user: campusmess
    plan: free
